[project]
name = "sekretaer"
version = "0.1.0"
description = "Sekretär Python sidecar: local audio capture, VAD, STT, breakpoint detection and incremental structured notes via claude -p"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "jsonschema>=4.23",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Live audio capture. PyAudioWPatch provides WASAPI loopback (system audio) on Windows.
audio = [
    "sounddevice>=0.4.7",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]
# Local speech recognition. The model itself is only downloaded on an explicit user action.
stt = ["faster-whisper>=1.1"]
# Silero VAD runs on onnxruntime; the ONNX model file ships inside faster-whisper (stt extra)
# or the silero-vad package. Without it an energy VAD fallback is used (reported in /health).
vad = ["onnxruntime>=1.17"]
# Encrypted audio archive: AES-GCM + per-meeting key in the OS credential store.
crypto = ["cryptography>=42", "keyring>=25"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "cryptography>=42",
]

[project.scripts]
sekretaer-sidecar = "sekretaer.__main__:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sekretaer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "S101",   # assert in tests
    "S311",   # random for non-crypto
    "S603",   # subprocess without shell is the intended design
    "S608",   # SQL built from constant fragments only
    "B008",
    "ASYNC109",
    "ASYNC110",
    "UP040",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
